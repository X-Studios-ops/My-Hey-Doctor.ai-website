<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heydoctor AI | The Ultimate Learning Super-App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* Animated Gradient Background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f172a, #082f49);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Keeps layout full screen */
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Navbar */
        .navbar {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .navbar p {
            margin: 0;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 300;
        }

        /* Nav Right Buttons */
        .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Back to Home Button */
        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            padding: 8px 15px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* Status Badge */
        .status-badge {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.4);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #4ade80;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        /* AI App Container */
        .app-container {
            flex-grow: 1; /* Pushes footer down and fills space */
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            height: 100%;
        }

        /* Iframe styling */
        iframe {
            width: 100%;
            max-width: 1300px;
            height: 100%;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
            background-color: #ffffff;
        }

        /* Footer Styling */
        .footer {
            text-align: center;
            padding: 10px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .footer span {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* Mobile Adjustments (Sahi Layout Ke Liye) */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 15px 10px;
            }
            .nav-right {
                flex-wrap: wrap;
                justify-content: center;
            }
            .app-container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div>
            <h1>⚡ Heydoctor ai</h1>
            <p>Your Advanced Multimodal Health Ai</p>
        </div>
        
        <div class="nav-right">
            <a href="https://my-hey-doctor-ai-website.vercel.app" class="back-btn">
                🏠 Main Website
            </a>
            
            <div class="status-badge">
                <div class="status-dot"></div>
                Systems Online
            </div>
        </div>
    </div>

    <div class="app-container">
        <iframe src="https://heydoctor-study-ai.streamlit.app/?embed=true" title="Heydoctor AI App"></iframe>
    </div>

    <div class="footer">
        Engineered with ❤️ by <span>Pratyush Ranjan Roul</span> | Multi-Modal Intelligence
    </div>

</body>
</html>
