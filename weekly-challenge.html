<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeyDoctor Weekly Challenge</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
.container{max-width:1100px;margin:auto;padding:20px}
.hero{background:linear-gradient(135deg,#10b981,#0ea5e9);padding:30px;border-radius:20px}
.card{background:#111827;border-radius:16px;padding:20px;margin-top:20px}
input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none}
button{background:#10b981;color:#fff;border:none;padding:12px 18px;border-radius:10px;cursor:pointer}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.podium .card{text-align:center}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #333;text-align:left}
</style>
</head>
<body>
<div class="container">
<div class="hero">
<h1>🏆 HeyDoctor Weekly Challenge</h1>
<p>Submit your best health question and climb the leaderboard.</p>
</div>

<div class="card">
<h2>✍️ Submit Question</h2>
<input id="name" placeholder="Your Name">
<textarea id="question" rows="4" placeholder="Your question"></textarea>
<button id="submitBtn">Submit</button>
</div>

<div class="card">
<h2>🥇 Weekly Winners</h2>
<div class="podium">
<div class="card">🥈 Runner Up</div>
<div class="card">🥇 Champion</div>
<div class="card">🥉 Third Place</div>
</div>
</div>

<div class="card">
<h2>📈 Top 10 Leaderboard</h2>
<table>
<thead><tr><th>Rank</th><th>Name</th><th>Score</th></tr></thead>
<tbody id="leaderboard"></tbody>
</table>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDbLNHC559dram--QmrsfWVQdlw8J2Q6XY",
  authDomain: "question-of-the-week-challenge.firebaseapp.com",
  projectId: "question-of-the-week-challenge",
  storageBucket: "question-of-the-week-challenge.firebasestorage.app",
  messagingSenderId: "513283085826",
  appId: "1:513283085826:web:8b47b50a02a1b514f9b91b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadLeaderboard(){
 const tbody=document.getElementById("leaderboard");
 tbody.innerHTML="";
 const q=query(collection(db,"challenge_entries"),orderBy("score","desc"),limit(10));
 const snap=await getDocs(q);
 let rank=1;
 snap.forEach(doc=>{
   const d=doc.data();
   tbody.innerHTML += `<tr><td>${rank++}</td><td>${d.name}</td><td>${d.score}</td></tr>`;
 });
}

document.getElementById("submitBtn").addEventListener("click", async ()=>{
 const name=document.getElementById("name").value.trim();
 const question=document.getElementById("question").value.trim();
 if(!name || !question){ alert("Fill all fields"); return; }
 const score=Math.floor(Math.random()*40)+60;
 await addDoc(collection(db,"challenge_entries"),{
   name,question,score,timestamp:new Date()
 });
 alert("Submitted! Score: "+score);
 loadLeaderboard();
});

loadLeaderboard();
</script>
</body>
</html>
