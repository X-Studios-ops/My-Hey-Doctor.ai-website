<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyDoctor PRO | Ultimate Health Challenge</title>
    <style>
        /* CSS MODULE - PRO DESIGN SYSTEM
           Total Lines: 100+ for premium look
        */
        :root {
            --primary: #10b981;
            --accent: #0ea5e9;
            --bg: #050505;
            --card: #111;
            --text: #ffffff;
        }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            line-height: 1.6;
        }
        .container { max-width: 700px; margin: auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .podium-box { 
            height: 200px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center; 
            gap: 20px; 
            margin-bottom: 40px; 
            padding: 20px;
            background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
            border-radius: 20px;
        }
        .podium-item { text-align: center; width: 100px; }
        .card { 
            background: var(--card); 
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid #333; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        input, textarea { 
            width: 100%; 
            padding: 15px; 
            background: #1a1a1a; 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 12px; 
            margin: 10px 0;
            font-size: 16px;
        }
        button { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(90deg, var(--primary), var(--accent)); 
            border: none; 
            color: #fff; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; border-bottom: 1px solid #222; text-align: left; }
        .rank-badge { width: 30px; height: 30px; border-radius: 50%; display: inline-block; background: #333; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏆 HeyDoctor PRO</h1>
        <p>Advanced Health Intellect Leaderboard</p>
    </div>

    <div class="podium-box">
        <div class="podium-item">🥈<br><strong id="p2">-</strong></div>
        <div class="podium-item" style="font-size: 1.5em;">🥇<br><strong id="p1">-</strong></div>
        <div class="podium-item">🥉<br><strong id="p3">-</strong></div>
    </div>

    <div class="card">
        <h3>Submit Your Query</h3>
        <input id="name" placeholder="Full Name">
        <textarea id="question" rows="4" placeholder="Detailed health question here..."></textarea>
        <button id="submitBtn">Submit & Analyze</button>
        <p id="status" style="font-size: 12px; color: #888; margin-top: 10px;"></p>
    </div>

    <div class="card">
        <h3>Global Rankings</h3>
        <table id="leaderboard">
            <thead><tr><th>Rank</th><th>Name</th><th>Score</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script type="module">
    // FIREBASE INITIALIZATION AND LOGIC
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, addDoc, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyDbLNHC559dram--QmrsfWVQdlw8J2Q6XY",
        authDomain: "question-of-the-week-challenge.firebaseapp.com",
        projectId: "question-of-the-week-challenge",
        storageBucket: "question-of-the-week-challenge.firebasestorage.app",
        messagingSenderId: "513283085826",
        appId: "1:513283085826:web:8b47b50a02a1b514f9b91b"
    }));

    const SMARTLINK = "https://www.effectivecpmnetwork.com/t8mtixvjhy?key=2b2d18117f937f69e3bd00eb2ab41f12";

    // EXTENSIVE SMART SCORING LOGIC
    function getSmartPoints(q) {
        let s = 10;
        const t = q.toLowerCase();
        // Advanced Keyword Matching
        const highValue = ["diabetes", "symptoms", "treatment", "medulla", "anatomy", "physiology", "pathology"];
        const midValue = ["pain", "fever", "heart", "diet", "prevention", "causes", "health"];
        
        if(t.length > 200) s += 50;
        else if(t.length > 50) s += 25;

        highValue.forEach(k => { if(t.includes(k)) s += 30; });
        midValue.forEach(k => { if(t.includes(k)) s += 15; });
        
        if(t.includes("?")) s += 10;
        return Math.min(s, 100);
    }

    // LOAD AND RENDER DATA
    async function loadData() {
        try {
            const snap = await getDocs(query(collection(db, "challenge_entries"), orderBy("score", "desc")));
            const tbody = document.querySelector("#leaderboard tbody");
            tbody.innerHTML = "";
            let rank = 1;
            snap.forEach((doc, i) => {
                const d = doc.data();
                if(i === 0) document.getElementById("p1").innerText = d.name;
                if(i === 1) document.getElementById("p2").innerText = d.name;
                if(i === 2) document.getElementById("p3").innerText = d.name;
                tbody.innerHTML += `<tr><td>${rank++}</td><td>${d.name}</td><td>${d.score || 0}</td></tr>`;
            });
        } catch(e) { console.error("Error loading data:", e); }
    }

    // FORM SUBMISSION ENGINE
    document.getElementById("submitBtn").onclick = async () => {
        const name = document.getElementById("name").value.trim();
        const q = document.getElementById("question").value.trim();
        
        // Validation Layer
        if(!name || q.length < 15) { alert("Please provide a valid name and detailed question (min 15 chars)."); return; }

        // Daily Limit Logic
        let usage = JSON.parse(localStorage.getItem('usage')) || {count: 0, date: new Date().toDateString()};
        if(usage.date !== new Date().toDateString()) usage = {count: 0, date: new Date().toDateString()};
        if(usage.count >= 3) { window.open(SMARTLINK, "_blank"); return; }

        document.getElementById("status").innerText = "Analyzing question quality...";

        // Update Database Logic
        const snap = await getDocs(query(collection(db, "challenge_entries"), where("name", "==", name)));
        if(!snap.empty) {
            await updateDoc(snap.docs[0].ref, { score: (snap.docs[0].data().score || 0) + getSmartPoints(q) });
        } else {
            await addDoc(collection(db, "challenge_entries"), { name, score: getSmartPoints(q) });
        }
        
        usage.count++;
        localStorage.setItem('usage', JSON.stringify(usage));
        location.reload();
    };

    loadData();
</script>
</body>
</html>
