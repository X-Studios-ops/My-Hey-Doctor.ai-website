<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyDoctor PRO | Smart Challenge</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #444; background: #000; color: #fff; margin: 10px 0; }
        button { background: linear-gradient(90deg, #10b981, #0ea5e9); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; border-bottom: 1px solid #333; text-align: left; }
    </style>
</head>
<body>
<div class="container">
    <div class="card" style="text-align:center;">
        <h1>🏆 HeyDoctor Intelligence</h1>
        <p>Smart Question = Smart Score.</p>
    </div>

    <div class="card">
        <input id="name" placeholder="Your Name">
        <textarea id="question" rows="4" placeholder="Write your detailed health question..."></textarea>
        <button id="submitBtn">Submit & Get Scored</button>
    </div>

    <div class="card">
        <h2>📈 Global Leaderboard</h2>
        <table><thead><tr><th>Rank</th><th>Name</th><th>Score</th></tr></thead><tbody id="leaderboard"></tbody></table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDbLNHC559dram--QmrsfWVQdlw8J2Q6XY",
        authDomain: "question-of-the-week-challenge.firebaseapp.com",
        projectId: "question-of-the-week-challenge",
        storageBucket: "question-of-the-week-challenge.firebasestorage.app",
        messagingSenderId: "513283085826",
        appId: "1:513283085826:web:8b47b50a02a1b514f9b91b"
    };

    const db = getFirestore(initializeApp(firebaseConfig));
    const SMARTLINK = "https://www.effectivecpmnetwork.com/t8mtixvjhy?key=2b2d18117f937f69e3bd00eb2ab41f12";

    // SMART SCORING LOGIC
    function getSmartPoints(q) {
        let score = 10;
        const text = q.toLowerCase();
        
        // 1. Length Bonus
        if(text.length > 100) score += 40;
        else if(text.length > 50) score += 20;

        // 2. Medical Keywords (The Brain)
        const keywords = ["diabetes", "symptoms", "treatment", "pain", "fever", "heart", "medulla", "diet", "prevention", "causes", "health", "doctor"];
        keywords.forEach(word => { if(text.includes(word)) score += 15; });

        // 3. Question Structure
        if(text.includes("?")) score += 10;
        if(text.includes("how") || text.includes("why") || text.includes("what")) score += 10;

        return Math.min(score, 100);
    }

    async function submitData() {
        // Daily Limit Check
        let usage = JSON.parse(localStorage.getItem('usage')) || {count: 0, date: new Date().toDateString()};
        if(usage.date !== new Date().toDateString()) usage = {count: 0, date: new Date().toDateString()};
        
        if(usage.count >= 3) { window.open(SMARTLINK, "_blank"); return; }

        const name = document.getElementById("name").value.trim();
        const question = document.getElementById("question").value.trim();
        
        if(name.length < 3 || question.length < 10) { alert("Sawaal thoda detail mein likhein!"); return; }

        const score = getSmartPoints(question);
        
        // Firebase Logic
        const q = query(collection(db, "challenge_entries"), where("name", "==", name));
        const snap = await getDocs(q);

        if(!snap.empty) {
            await updateDoc(snap.docs[0].ref, { score: snap.docs[0].data().score + score });
        } else {
            await addDoc(collection(db, "challenge_entries"), { name, score, timestamp: new Date() });
        }

        usage.count++;
        localStorage.setItem('usage', JSON.stringify(usage));
        alert("Success! You earned " + score + " points.");
        location.reload();
    }

    document.getElementById("submitBtn").onclick = submitData;
    
    // Load Leaderboard
    const q = query(collection(db, "challenge_entries"), orderBy("score", "desc"));
    const snap = await getDocs(q);
    snap.forEach((doc, i) => {
        document.getElementById("leaderboard").innerHTML += `<tr><td>${i+1}</td><td>${doc.data().name}</td><td>${doc.data().score}</td></tr>`;
    });
</script>
</body>
</html>
