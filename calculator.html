<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Wellness Report - HEY DOCTOR.AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .main-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { color: #1a73e8; font-size: 24px; text-align: center; margin-bottom: 20px; }
        label { font-weight: 600; display: block; margin-top: 15px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .btn-calc { background: #1a73e8; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .btn-calc:hover { background: #1557b0; }
        #report-section { margin-top: 25px; padding: 20px; background: #e8f0fe; border-radius: 8px; display: none; text-align: center; }
        .btn-pdf { background: #34a853; color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="main-card">
    <h1>HEY DOCTOR.AI</h1>
    <label>Full Name</label>
    <input type="text" id="name" placeholder="John Doe">
    
    <label>Weight (kg)</label>
    <input type="number" id="weight" placeholder="e.g. 70">
    
    <label>Height (cm)</label>
    <input type="number" id="height" placeholder="e.g. 175">

    <button class="btn-calc" onclick="calculate()">Generate Report</button>

    <div id="report-section">
        <p id="result-text"></p>
        <button class="btn-pdf" onclick="downloadPDF()">Download PDF Report</button>
    </div>
</div>

<script>
    let userData = {};

    function calculate() {
        let name = document.getElementById('name').value;
        let w = parseFloat(document.getElementById('weight').value);
        let h = parseFloat(document.getElementById('height').value) / 100;
        let bmi = (w / (h * h)).toFixed(1);
        let cat = bmi < 18.5 ? "Underweight" : bmi < 25 ? "Healthy" : "Overweight";
        
        userData = { name, w, bmi, cat };
        
        document.getElementById('report-section').style.display = "block";
        document.getElementById('result-text').innerHTML = `<strong>${name}</strong>, your BMI is <strong>${bmi}</strong> (${cat}).`;
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("HEY DOCTOR.AI - Health Report", 20, 20);
        doc.text(`Name: ${userData.name}`, 20, 40);
        doc.text(`BMI Score: ${userData.bmi}`, 20, 50);
        doc.text(`Category: ${userData.cat}`, 20, 60);
        doc.save(`${userData.name}_Report.pdf`);
    }
</script>

</body>
</html>
