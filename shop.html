<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HeyDoctor AI Health Store - Discover trusted health, fitness, skincare, haircare and wellness products recommended by HeyDoctor AI.">
    <title>HeyDoctor AI Health Store</title>
    
    <!-- Schema Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "HeyDoctor AI Health Store",
      "description": "Discover trusted health, fitness, skincare, haircare and wellness products recommended by HeyDoctor AI.",
      "publisher": {
        "@type": "Organization",
        "name": "HeyDoctor AI"
      }
    }
    </script>

    <style>
        /* CSS Variables for Dark/Light Mode & Theming */
        :root {
            --primary: #10B981;
            --primary-hover: #059669;
            --bg-body: #f8fafc;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f172a;
                --bg-glass: rgba(15, 23, 42, 0.8);
                --bg-card: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: rgba(255, 255, 255, 0.1);
                --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4rem 2rem 2rem;
            background: linear-gradient(135deg, rgba(16,185,129,0.1) 0%, rgba(15,23,42,0) 100%);
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, var(--primary), #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

        /* Sticky Controls: Search, Sort, Tabs */
        .sticky-controls {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            box-shadow: var(--shadow-glass);
        }

        .search-sort-container {
            display: flex; gap: 1rem; max-width: 1200px; margin: 0 auto 1rem auto; flex-wrap: wrap;
        }

        .search-bar { flex: 1; min-width: 250px; position: relative; }

        .search-bar input {
            width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border-radius: 999px;
            border: 1px solid var(--border-color); background: var(--bg-card);
            color: var(--text-main); font-size: 1rem; outline: none; transition: box-shadow 0.3s, border-color 0.3s;
        }

        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        .search-bar::before { content: '🔍'; position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); opacity: 0.7; }

        .sort-select {
            padding: 0.75rem 1rem; border-radius: 999px; border: 1px solid var(--border-color);
            background: var(--bg-card); color: var(--text-main); font-size: 1rem; outline: none; cursor: pointer;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex; gap: 0.5rem; overflow-x: auto; max-width: 1200px; margin: 0 auto; padding-bottom: 0.5rem; scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 0.5rem 1rem; border-radius: 999px; cursor: pointer; white-space: nowrap; font-weight: 500; transition: all 0.3s;
        }
        .tab-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Main Content */
        main { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; min-height: 60vh; }

        .section-title { font-size: 1.5rem; margin: 2rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--border-color); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }

        /* Product Cards */
        .product-card {
            background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color);
            overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); animation: fadeIn 0.5s ease backwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }

        .card-img-container { width: 100%; height: 200px; overflow: hidden; position: relative; background: #fff; padding: 10px;}
        .card-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.5s ease; }
        .product-card:hover .card-img { transform: scale(1.05); }
        
        .badge {
            position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.8); color: #fff;
            padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: bold; z-index: 2;
        }

        .card-content { padding: 1.5rem; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .card-rating { color: #fbbf24; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .card-rating span { color: var(--text-muted); font-size: 0.8rem; margin-left: 0.25rem; }
        .card-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; flex: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .card-price { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }

        .btn-buy {
            background-color: #ff9900; /* Amazon Orange Color */
            color: #ffffff; text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 8px;
            font-weight: 600; font-size: 0.9rem; transition: background-color 0.2s, transform 0.1s;
        }
        .btn-buy:hover { background-color: #e68a00; }
        .btn-buy:active { transform: scale(0.95); }
        .no-results { text-align: center; padding: 4rem; color: var(--text-muted); grid-column: 1 / -1; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; } .search-sort-container { flex-direction: column; }
            .sort-select { width: 100%; } .product-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>🛒 HeyDoctor AI Health Store</h1>
        <p>Discover trusted health, fitness, skincare, haircare and wellness products recommended by HeyDoctor AI.</p>
    </header>

    <div class="sticky-controls">
        <div class="search-sort-container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search health products...">
            </div>
            <select id="sortSelect" class="sort-select">
                <option value="popular">Most Popular</option>
                <option value="rating">Highest Rated</option>
                <option value="newest">Newest</option>
                <option value="newest">Today's Deals</option>
            </select>
        </div>
        <div class="category-tabs" id="categoryTabs">
            <button class="tab-btn active" data-category="All">All Products</button>
            <button class="tab-btn" data-category="Fitness">💪 Fitness</button>
            <button class="tab-btn" data-category="Nutrition">🥗 Nutrition</button>
            <button class="tab-btn" data-category="Hair Care">💇 Hair Care</button>
            <button class="tab-btn" data-category="Today's Deals">⚡ Today's Deals</button>
        </div>
    </div>

    <main>
        <div id="dynamicSections">
            <!-- Sections injected via JS -->
        </div>
    </main>

    <script>
        // TERE ASLI PRODUCTS AUR REAL AMAZON LINKS YAHAN HAIN
       const products = [
    { 
        id: 1, 
        name: "Adjustable Dumbbell Set", 
        category: "Fitness", 
        price: "₹ Check on Amazon", 
        rating: 4.5, 
        reviews: 1240, 
        desc: "Perfect adjustable dumbbells for your home strength training and muscle building.", 
        img: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=600&q=80", 
        section: "🏆 Best Sellers", 
        date: "2026-06-01", 
        popScore: 100,
        link: "https://amzn.to/4bc3sC3" 
    },
    { 
        id: 2, 
        name: "OZiva Protein & Herbs (Women)", 
        category: "Nutrition", 
        price: "₹ Check on Amazon", 
        rating: 4.6, 
        reviews: 4500, 
        desc: "Chocolate flavor, 0g added sugar. Designed specially for women's wellness and fitness.", 
        img: "https://images.unsplash.com/photo-1593095948071-474c5cc2989d?auto=format&fit=crop&w=600&q=80", 
        section: "🔥 Trending Products", 
        date: "2026-06-15", 
        popScore: 98,
        link: "https://amzn.to/4vFAJOe" 
    },
    { 
        id: 3, 
        name: "Just Herbs Anti Hairfall Shampoo", 
        category: "Hair Care", 
        price: "₹ Check on Amazon", 
        rating: 4.3, 
        reviews: 3200, 
        desc: "Ayurvedic blend to strengthen roots, reduce hair fall, and improve scalp health.", 
        img: "https://images.unsplash.com/photo-1526947425960-945c6e72858f?auto=format&fit=crop&w=600&q=80", 
        section: "⭐ Editor's Picks", 
        date: "2026-07-01", 
        popScore: 95,
        link: "https://amzn.to/44R4M9L" 
    },
    { 
        id: 4, 
        name: "Just Herbs 8-in-1 Amla Neem Shampoo", 
        category: "Hair Care", 
        price: "₹ Check on Amazon", 
        rating: 4.4, 
        reviews: 2800, 
        desc: "Root nourishing, hair fall control, sulphate & paraben free. Suitable for oily scalp.", 
        img: "https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?auto=format&fit=crop&w=600&q=80", 
        section: "🔥 Trending Products", 
        date: "2026-07-05", 
        popScore: 97,
        link: "https://amzn.to/4fkwMZu" 
    },
    { 
        id: 5, 
        name: "TATA 1MG Creatine Monohydrate", 
        category: "Nutrition", 
        price: "₹ Check on Amazon", 
        rating: 4.7, 
        reviews: 5100, 
        desc: "100% Pure, micronized creatine. Boosts strength, power, and muscle recovery.", 
        img: "https://images.unsplash.com/photo-1579722820308-d74e571900a9?auto=format&fit=crop&w=600&q=80", 
        section: "🏆 Best Sellers", 
        date: "2026-07-05", 
        popScore: 99,
        link: "https://amzn.to/4wrdPu6" 
    },
        { 
        id: 6, 
        name: "Bodyband Hand Grip Strengthener", 
        category: "Fitness", 
        price: "₹ 99", 
        rating: 4.0, 
        reviews: 4200, 
        desc: "Adjustable hand gripper for forearm exercise and finger power. Perfect for gym or home workouts.", 
        img: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=600&q=80", 
        section: "⚡ Today's Deals", 
        date: "2026-07-05", 
        popScore: 96,
        link: "https://amzn.to/4p4RhN1" 
    }
];

        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const categoryTabs = document.getElementById('categoryTabs');
        const dynamicSections = document.getElementById('dynamicSections');

        let currentCategory = 'All';
        let currentSearch = '';
        let currentSort = 'popular';

        function init() {
            attachEventListeners();
            renderView();
        }

        function attachEventListeners() {
            searchInput.addEventListener('input', (e) => { currentSearch = e.target.value.toLowerCase(); renderView(); });
            sortSelect.addEventListener('change', (e) => { currentSort = e.target.value; renderView(); });
            categoryTabs.addEventListener('click', (e) => {
                if (e.target.classList.contains('tab-btn')) {
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.getAttribute('data-category');
                    renderView();
                }
            });
        }

        function getFilteredAndSortedProducts() {
            let filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'All' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(currentSearch) || p.desc.toLowerCase().includes(currentSearch);
                return matchesCategory && matchesSearch;
            });

            filtered.sort((a, b) => {
                switch(currentSort) {
                    case 'rating': return b.rating - a.rating;
                    case 'newest': return new Date(b.date) - new Date(a.date);
                    case 'popular': default: return b.popScore - a.popScore;
                }
            });
            return filtered;
        }

        function getStars(rating) {
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 >= 0.5 ? 1 : 0;
            const emptyStars = 5 - fullStars - halfStar;
            return '★'.repeat(fullStars) + (halfStar ? '⯨' : '') + '☆'.repeat(emptyStars);
        }

        // YAHAN MERA MAGIC HAI: ${product.link} ASLI LINK CALL KAR RAHA HAI
        function buildProductCard(product) {
            return `
                <div class="product-card" style="animation-delay: ${Math.random() * 0.2}s">
                    <div class="card-img-container">
                        ${product.section !== "None" && currentCategory === 'All' && currentSearch === '' ? `<div class="badge">${product.section.split(' ')[1] || product.section}</div>` : ''}
                        <img src="${product.img}" alt="${product.name}" class="card-img" loading="lazy">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${product.name}</h3>
                        <div class="card-rating">
                            ${getStars(product.rating)} <span>(${product.reviews})</span>
                        </div>
                        <p class="card-desc">${product.desc}</p>
                        <div class="card-footer">
                            <span class="card-price" style="font-size: 1rem; color: #10B981;">${product.price}</span>
                            <a href="${product.link}" target="_blank" class="btn-buy">🛒 Buy on Amazon</a>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderView() {
            const displayProducts = getFilteredAndSortedProducts();
            dynamicSections.innerHTML = ''; 

            if (displayProducts.length === 0) {
                dynamicSections.innerHTML = `<div class="no-results"><h3>No products found. Try a different search or category.</h3></div>`;
                return;
            }

            if (currentCategory === 'All' && currentSearch === '' && currentSort === 'popular') {
                const sections = ["🏆 Best Sellers", "🔥 Trending Products", "⭐ Editor's Picks",⚡ Today's Deals];
                sections.forEach(secTitle => {
                    const secProducts = displayProducts.filter(p => p.section === secTitle);
                    if (secProducts.length > 0) {
                        const sectionHTML = `
                            <h2 class="section-title">${secTitle}</h2>
                            <div class="product-grid">
                                ${secProducts.map(buildProductCard).join('')}
                            </div>
                        `;
                        dynamicSections.insertAdjacentHTML('beforeend', sectionHTML);
                    }
                });
            } else {
                dynamicSections.innerHTML = `
                    <div class="product-grid" style="margin-top: 1rem;">
                        ${displayProducts.map(buildProductCard).join('')}
                    </div>
                `;
            }
        }

        init();
    </script>
</body>
</html>
