<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Health Report - HEY DOCTOR.AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-main:hover { background: #c0392b; }
        .btn-home { width: 100%; padding: 15px; background: #34495e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; text-decoration: none; display: block; }
        .btn-home:hover { background: #2c3e50; }
        /* Disclaimer Style */
        .disclaimer { font-size: 11px; color: #7f8c8d; margin-top: 20px; text-align: center; line-height: 1.4; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Medical Wellness Report</h2>
    <input type="text" id="name" placeholder="Full Name">
    
    <div class="grid">
        <input type="number" id="age" placeholder="Age">
        <select id="bloodGroup">
            <option value="">Blood Group</option>
            <option>A+</option><option>B+</option><option>AB+</option><option>O+</option>
            <option>A-</option><option>B-</option><option>AB-</option><option>O-</option>
        </select>
    </div>

    <input type="text" id="bp" placeholder="Blood Pressure (e.g. 120/80)">
    <input type="text" id="symptoms" placeholder="Current Symptoms">
    
    <button class="btn-main" onclick="generateReport()">Generate & Download Report</button>
    <a href="index.html" class="btn-home">Back to Home</a>

    <div class="disclaimer">
        <strong>Disclaimer:</strong> HEY DOCTOR.AI is for informational purposes only and does not provide medical diagnosis or treatment. This report is not a substitute for professional medical advice. Always consult with a qualified healthcare provider for any health concerns.
    </div>
</div>

<script>
    function generateReport() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        let name = document.getElementById('name').value;
        let age = document.getElementById('age').value;
        let blood = document.getElementById('bloodGroup').value;
        let bp = document.getElementById('bp').value;
        let symp = document.getElementById('symptoms').value;

        doc.setFontSize(18);
        doc.text("HEY DOCTOR.AI - Medical Report", 20, 20);
        doc.setFontSize(12);
        doc.text(`Patient Name: ${name || 'N/A'}`, 20, 40);
        doc.text(`Age: ${age || 'N/A'}`, 20, 50);
        doc.text(`Blood Group: ${blood || 'N/A'}`, 20, 60);
        doc.text(`Blood Pressure: ${bp || 'N/A'}`, 20, 70);
        doc.text(`Symptoms: ${symp || 'N/A'}`, 20, 80);
        doc.text("Date: " + new Date().toLocaleDateString(), 20, 100);
        
        // Add disclaimer to PDF too
        doc.setFontSize(8);
        doc.text("Disclaimer: This report is for information only and not a medical diagnosis.", 20, 280);
        
        doc.save(`${name || 'Health'}_Report.pdf`);
    }
</script>

</body>
</html>
